# Copy to ~/.config/mailabruf/accounts/<name>.toml and run: chmod 600 <file>
# The file name (without .toml) is the account name used on the command line.

host = "imap.strato.de"
port = 993                     # IMAPS; for STARTTLS use: port = 143, ssl = false, starttls = true
ssl = true
username = "info@example.de"
password = "change-me"

# Where the .eml files go; "~" is expanded, relative paths are relative to the config directory.
# May be omitted if config.toml sets [defaults] target_dir (then <target_dir>/<account name>).
target_dir = "~/Mail-Archiv/info"

# Optional
enabled = true                 # false: skipped by "mailabruf fetch" unless named explicitly
exclude_folders = []           # e.g. ["Spam", "Papierkorb"]
timeout = 60                   # seconds
