[project]
name = "mailabruf"
version = "0.2.0"
description = "Download all messages of IMAP mailboxes into local .eml files, with PDF copies and an HTML index"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Hotzel" }]
requires-python = ">=3.11"
dependencies = [
    "weasyprint>=70.0",
]

[project.urls]
Repository = "https://github.com/mhotzel/mailabruf"

[project.scripts]
mailabruf = "mailabruf.cli:main"

[dependency-groups]
dev = [
    "pypdf>=6.21.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
