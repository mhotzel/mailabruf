[project]
name = "mailabruf"
version = "0.2.0"
description = "Download all messages of IMAP mailboxes into local .eml files, with PDF copies and an HTML index"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "weasyprint>=70.0",
]

[project.scripts]
mailabruf = "mailabruf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
